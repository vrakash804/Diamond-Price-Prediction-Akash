<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <title>Diamond Price Prediction</title>
</head>

<body>

    <h1>
        <center>Diamond Price Prediction</center>
    </h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('predict_datapoint') }}" method="POST">

        <!-- Carat -->
        <div class="form-group">
            <label for="carat">Carat:</label>

            <input
                type="number"
                step="0.01"
                min="0.1"
                max="5.5"
                id="carat"
                name="carat"
                placeholder="Enter carat value (0.1 - 5.5)"
                required
            >
        </div>


        <!-- Depth -->
        <div class="form-group">
            <label for="depth">Depth:</label>

            <input
                type="number"
                step="0.01"
                min="40"
                max="80"
                id="depth"
                name="depth"
                placeholder="Enter depth value (40 - 80)"
                required
            >
        </div>


        <!-- Table -->
        <div class="form-group">
            <label for="table">Table:</label>

            <input
                type="number"
                step="0.01"
                min="40"
                max="100"
                id="table"
                name="table"
                placeholder="Enter table value (40 - 100)"
                required
            >
        </div>


        <!-- X -->
        <div class="form-group">
            <label for="x">X:</label>

            <input
                type="number"
                step="0.01"
                min="0.1"
                max="15"
                id="x"
                name="x"
                placeholder="Enter X dimension in mm"
                required
            >
        </div>


        <!-- Y -->
        <div class="form-group">
            <label for="y">Y:</label>

            <input
                type="number"
                step="0.01"
                min="0.1"
                max="15"
                id="y"
                name="y"
                placeholder="Enter Y dimension in mm"
                required
            >
        </div>


        <!-- Z -->
        <div class="form-group">
            <label for="z">Z:</label>

            <input
                type="number"
                step="0.01"
                min="0.1"
                max="15"
                id="z"
                name="z"
                placeholder="Enter Z dimension in mm"
                required
            >
        </div>


        <!-- Cut -->
        <div class="form-group">
            <label for="cut">Cut:</label>

            <select id="cut" name="cut" required>

                <option value="Fair">Fair</option>
                <option value="Good">Good</option>
                <option value="Very Good">Very Good</option>
                <option value="Premium">Premium</option>
                <option value="Ideal">Ideal</option>

            </select>
        </div>


        <!-- Color -->
        <div class="form-group">
            <label for="color">Color:</label>

            <select id="color" name="color" required>

                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>

            </select>
        </div>


        <!-- Clarity -->
        <div class="form-group">
            <label for="clarity">Clarity:</label>

            <select id="clarity" name="clarity" required>

                <option value="I1">I1</option>
                <option value="SI2">SI2</option>
                <option value="SI1">SI1</option>
                <option value="VS2">VS2</option>
                <option value="VS1">VS1</option>
                <option value="VVS2">VVS2</option>
                <option value="VVS1">VVS1</option>
                <option value="IF">IF</option>

            </select>
        </div>


        <div style="clear: both;"></div>


        <!-- Submit -->
        <input
            type="submit"
            value="Predict Diamond Price"
        >

    </form>

</body>
</html>
